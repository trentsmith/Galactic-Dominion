name: Build playable desktop release
on:
  push:
    branches: [phase-43-polish]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and native export templates
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          ln -s /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /tmp/godot/godot
          echo '/tmp/godot' >> "$GITHUB_PATH"
          curl -fL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          out=Path('/tmp/templates');out.mkdir()
          with ZipFile('/tmp/templates.tpz') as archive:
              for name in archive.namelist():
                  if any(x in name for x in ['windows_release_x86_64','linux_release.x86_64','version.txt']):
                      (out/Path(name).name).write_bytes(archive.read(name))
          PY
          curl -fL --retry 3 -o /tmp/python-embed.zip https://www.python.org/ftp/python/3.13.7/python-3.13.7-embed-amd64.zip
      - name: Verify wilderness streaming
        run: godot --headless --path . --editor --import --quit && godot --headless --path . --script res://tests/wilderness_test.gd --fixed-fps 60
      - name: Export and package clients and servers
        run: python3 tools/build_release.py --godot /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 --templates /tmp/templates --python-embed /tmp/python-embed.zip
      - name: Verify standalone Linux startup
        run: |
          build/linux/GalacticDominion.x86_64 --headless --quit-after 30 -- --free-roam > /tmp/game.log 2>&1
          cat /tmp/game.log
          grep GALACTIC_FREE_ROAM_READY /tmp/game.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/game.log; then exit 1; fi
      - name: Verify standalone Frontier board
        run: |
          build/linux/GalacticDominion.x86_64 --headless --quit-after 30 -- --frontier > /tmp/journal.log 2>&1
          cat /tmp/journal.log
          grep GALACTIC_FRONTIER_READY /tmp/journal.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/journal.log; then exit 1; fi
      - name: Verify standalone atlas and journey
        run: |
          for view in atlas journey; do
            build/linux/GalacticDominion.x86_64 --headless --quit-after 30 -- --"$view" > /tmp/pathfinders-ui.log 2>&1
            cat /tmp/pathfinders-ui.log
            grep GALACTIC_PATHFINDERS_READY /tmp/pathfinders-ui.log
            if grep -E 'SCRIPT ERROR|ERROR:' /tmp/pathfinders-ui.log; then exit 1; fi
          done
      - name: Verify standalone tutorial startup
        run: |
          build/linux/GalacticDominion.x86_64 --headless --quit-after 30 -- --tutorial > /tmp/tutorial.log 2>&1
          cat /tmp/tutorial.log
          grep GALACTIC_TUTORIAL_READY /tmp/tutorial.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/tutorial.log; then exit 1; fi
      - name: Verify restored standalone planet expeditions
        run: |
          for planet in 0 1 2; do
            build/linux/GalacticDominion.x86_64 --headless --quit-after 30 -- --planet "$planet" > /tmp/planet.log 2>&1
            cat /tmp/planet.log
            grep GALACTIC_PLANET_READY /tmp/planet.log
            if grep -E 'SCRIPT ERROR|ERROR:' /tmp/planet.log; then exit 1; fi
          done
      - name: Verify restored standalone sanctuary
        run: |
          build/linux/GalacticDominion.x86_64 --headless --quit-after 30 -- --sanctuary > /tmp/sanctuary.log 2>&1
          cat /tmp/sanctuary.log
          grep GALACTIC_SANCTUARY_READY /tmp/sanctuary.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/sanctuary.log; then exit 1; fi
      - name: Verify planet return with Nexus story and companion faces
        run: |
          GD_ENABLE_CAMPAIGN=1 godot --headless --path . --script res://tests/wildlife_return_test.gd --fixed-fps 60 > /tmp/wildlife-return.log 2>&1
          cat /tmp/wildlife-return.log
          grep 'WILDLIFE_RETURN_TEST: 42 checks, 0 failures' /tmp/wildlife-return.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/wildlife-return.log; then exit 1; fi
      - name: Verify orbiting companions with restored wildlife
        run: |
          GD_ENABLE_CAMPAIGN=1 godot --headless --path . --script res://tests/orbiting_restore_test.gd --fixed-fps 60 > /tmp/orbiting.log 2>&1
          cat /tmp/orbiting.log
          grep 'ORBITING_RESTORE_TEST: 11 checks, 0 failures' /tmp/orbiting.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/orbiting.log; then exit 1; fi
      - name: Verify both narrative protocols and objective rules
        run: |
          GD_ENABLE_CAMPAIGN=1 godot --headless --path . --script res://tests/nexus_narrative_test.gd --fixed-fps 60 > /tmp/narrative.log 2>&1
          cat /tmp/narrative.log
          grep 'NEXUS_NARRATIVE_TEST: 53 checks, 0 failures' /tmp/narrative.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/narrative.log; then exit 1; fi
      - name: Verify ship-only campaign and preserved records
        run: |
          GD_ENABLE_CAMPAIGN=1 godot --headless --path . --script res://tests/ship_campaign_test.gd --fixed-fps 60 > /tmp/ship-story.log 2>&1
          cat /tmp/ship-story.log
          grep 'SHIP_CAMPAIGN_TEST: 30 checks, 0 failures' /tmp/ship-story.log
          if grep -E 'SCRIPT ERROR|ERROR:' /tmp/ship-story.log; then exit 1; fi
      - name: Verify legacy mode and combat regressions
        env:
          GD_ENABLE_CREATURES: "1"
        run: |
          verify_godot() {
            test_name="$1"; shift
            test_log="/tmp/${test_name}.log"
            test_status=0
            godot --headless --path . --script "res://tests/${test_name}_test.gd" "$@" > "$test_log" 2>&1 || test_status=$?
            cat "$test_log"
            if grep -E 'SCRIPT ERROR|ERROR:' "$test_log"; then return 1; fi
            return "$test_status"
          }
          verify_godot component_discovery --fixed-fps 60
          verify_godot progression --fixed-fps 60
          verify_godot sanctuary_forms
          verify_godot creature_army
          verify_godot armada_sector --fixed-fps 60
          verify_godot armada_custom --fixed-fps 60
          verify_godot armada --fixed-fps 60
          verify_godot expansion_art --fixed-fps 60
          verify_godot story_campaign --fixed-fps 60
          verify_godot difficulty --fixed-fps 60
          verify_godot combat_feedback --fixed-fps 60
          verify_godot tutorial --fixed-fps 60
          verify_godot fleet_war --fixed-fps 60
          verify_godot solo_balance --fixed-fps 60
          verify_godot solo_skirmish --fixed-fps 60
          verify_godot planet_creature_battle
          verify_godot world_war
          verify_godot starlight_art
          verify_godot command_deck
          verify_godot fleet_companions
          verify_godot universal_liveries
          verify_godot celestial_art
          verify_godot landing_hunt
          verify_godot creature_loop --fixed-fps 60
          verify_godot planet_expedition --fixed-fps 60
          verify_godot fauna_polish --fixed-fps 60
          verify_godot capture_rescue
          python3 tests/test_army_network.py
          GD_TEST_COMPANION=crew_orbitot GD_TEST_VARIANT=variant_orbitot GD_TEST_HULL=skirmisher python3 tests/test_free_roam_network.py
          GD_TEST_COMPANION=crew_glimbloom GD_TEST_VARIANT=variant_glimbloom GD_TEST_HULL=guardian python3 tests/test_free_roam_network.py
      - name: Verify Frontier exploration, persistence and co-op
        run: |
          godot --headless --path . --script res://tests/frontier_test.gd --fixed-fps 60 > /tmp/frontier.log 2>&1
          cat /tmp/frontier.log
          grep '0 failures' /tmp/frontier.log
          if grep -E 'SCRIPT ERROR|ERROR:|FAIL:' /tmp/frontier.log; then exit 1; fi
          godot --headless --path . --script res://tests/frontier_jobs_test.gd --fixed-fps 60 > /tmp/frontier-jobs.log 2>&1
          cat /tmp/frontier-jobs.log
          grep '0 failures' /tmp/frontier-jobs.log
          if grep -E 'SCRIPT ERROR|ERROR:|FAIL:' /tmp/frontier-jobs.log; then exit 1; fi
          python3 -m unittest discover -s tests -p 'test_*service.py'
          python3 tests/test_frontier_network.py
      - name: Verify Pathfinders progression and navigation
        run: |
          godot --headless --path . --script res://tests/pathfinders_test.gd --fixed-fps 60 > /tmp/pathfinders.log 2>&1
          cat /tmp/pathfinders.log
          grep '0 failures' /tmp/pathfinders.log
          if grep -E 'SCRIPT ERROR|ERROR:|FAIL:' /tmp/pathfinders.log; then exit 1; fi
          godot --headless --path . --script res://tests/pathfinders_resume_test.gd --fixed-fps 60 > /tmp/pathfinders-resume.log 2>&1
          cat /tmp/pathfinders-resume.log
          grep '0 failures' /tmp/pathfinders-resume.log
          if grep -E 'SCRIPT ERROR|ERROR:|FAIL:' /tmp/pathfinders-resume.log; then exit 1; fi
      - name: Verify polish and disconnected co-op settlement
        run: |
          for suite in polish coop_settlement; do
            godot --headless --path . --script "res://tests/${suite}_test.gd" --fixed-fps 60 > /tmp/polish.log 2>&1
            cat /tmp/polish.log
            grep '0 failures' /tmp/polish.log
            if grep -E 'SCRIPT ERROR|ERROR:|FAIL:' /tmp/polish.log; then exit 1; fi
          done
          GD_TEST_REWARD_DISCONNECT=1 python3 tests/test_frontier_network.py
      - name: Compare all three solo 10v10 presets
        run: |
          for preset in relaxed standard veteran; do
            godot --headless --path . --script res://tests/solo_skirmish_test.gd --fixed-fps 60 -- --fleet-war --difficulty "$preset" > /tmp/preset.log 2>&1
            cat /tmp/preset.log
            grep SOLO_SKIRMISH_PASS /tmp/preset.log
            if grep -E 'SCRIPT ERROR|ERROR:' /tmp/preset.log; then exit 1; fi
          done
      - name: Verify packaged multiplayer server
        run: GD_TEST_COMBAT_BINARY="$PWD/build/server-linux/GalacticDominion.x86_64" python3 tests/test_network_integration.py
      - uses: actions/upload-artifact@v4
        with:
          name: galactic-dominion-desktop
          path: releases/*
      - name: Publish downloadable alpha release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v0.43.0
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title 'Galactic Dominion v0.43.0 — Flight Polish' --notes-file docs/RELEASE.md
          fi
          gh release upload "$tag" releases/* --clobber
